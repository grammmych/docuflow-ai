info:
  name: Create Document
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/documents"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "filename": "invoice-002.pdf"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
