info:
  name: Create Document
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/documents"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "filename": "test-bruno-555.pdf"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
